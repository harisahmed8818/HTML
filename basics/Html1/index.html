<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic User Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: url('https://source.unsplash.com/random/1600x900') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            transition: background-color 1s, background-image 1s;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            animation: bgChange 30s infinite alternate;
        }

        @keyframes bgChange {
            0% {
                background-color: rgba(0, 0, 0, 0.6);
                background-image: url('https://source.unsplash.com/random/1600x900');
            }
            50% {
                background-color: rgba(255, 223, 186, 0.6);
                background-image: url('https://source.unsplash.com/random/1600x900?landscape');
            }
            100% {
                background-color: rgba(0, 0, 0, 0.6);
                background-image: url('https://source.unsplash.com/random/1600x900?nature');
            }
        }

        h1 {
            color: #ffcc00;
            text-align: center;
            margin-bottom: 30px;
            font-size: 45px;
            text-shadow: 3px 3px 15px rgba(0, 0, 0, 0.6);
        }

        .container {
            width: 90%;
            max-width: 500px;
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            animation: scaleIn 1s ease-out;
            transition: transform 0.3s ease-in-out;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-container div {
            background-color: #333;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .form-container div:hover {
            background-color: #444;
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.5);
        }

        label {
            color: #ffcc00;
            font-size: 18px;
            margin-bottom: 5px;
            display: block;
        }

        input {
            padding: 15px;
            margin-bottom: 20px;
            width: 100%;
            border: 2px solid #555;
            border-radius: 8px;
            background-color: #222;
            color: #fff;
            font-size: 16px;
            transition: border-color 0.3s, background-color 0.3s;
        }

        input:focus {
            border-color: #ffcc00;
            outline: none;
            background-color: #333;
        }

        button {
            padding: 15px;
            background-color: #ffcc00;
            color: #222;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        button:hover {
            background-color: #ff9900;
            transform: scale(1.05);
        }

        .error, .success {
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            color: #fff;
        }

        .error {
            color: #e74c3c;
        }

        .success {
            color: #2ecc71;
        }

        .toggle {
            text-align: center;
            margin-top: 20px;
            font-size: 16px;
            color: #ffcc00;
            cursor: pointer;
            transition: text-decoration 0.3s ease;
        }

        .toggle:hover {
            text-decoration: underline;
        }

        .user-dashboard {
            display: none;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
        }

        .user-dashboard h2 {
            color: #ffcc00;
            font-size: 32px;
            margin-bottom: 30px;
        }

        .user-dashboard p {
            color: #fff;
            font-size: 18px;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Dynamic User Interface</h1>
        <div class="message" id="message"></div>

        <!-- User Dashboard (Hidden by default) -->
        <div class="user-dashboard" id="user-dashboard">
            <h2>Welcome, <span id="user-name"></span>!</h2>
            <p>Your personalized space. Enjoy your stay!</p>
        </div>

        <!-- Registration Form -->
        <div id="register-form">
            <h2>Register</h2>
            <form id="register">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required><br>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required><br>

                <label for="confirm-password">Confirm Password:</label>
                <input type="password" id="confirm-password" name="confirm-password" required><br>

                <button type="submit">Register</button>
                <div class="error" id="register-error"></div>
            </form>
        </div>

        <!-- Login Form -->
        <div id="login-form" style="display: none;">
            <h2>Login</h2>
            <form id="login">
                <label for="login-username">Username:</label>
                <input type="text" id="login-username" name="username" required><br>

                <label for="login-password">Password:</label>
                <input type="password" id="login-password" name="password" required><br>

                <button type="submit">Login</button>
                <div class="error" id="login-error"></div>
            </form>
        </div>

        <!-- Toggle Links -->
        <div class="toggle" id="toggle-login">Already have an account? Login</div>
        <div class="toggle" id="toggle-register" style="display: none;">Don't have an account? Register</div>
    </div>

    <script>
        // Toggle between Register and Login Forms
        document.getElementById("toggle-register").addEventListener("click", function() {
            document.getElementById("register-form").style.display = "block";
            document.getElementById("login-form").style.display = "none";
            document.getElementById("toggle-register").style.display = "none";
            document.getElementById("toggle-login").style.display = "block";
            document.getElementById("message").textContent = '';
            document.getElementById("register-error").textContent = '';
        });

        document.getElementById("toggle-login").addEventListener("click", function() {
            document.getElementById("login-form").style.display = "block";
            document.getElementById("register-form").style.display = "none";
            document.getElementById("toggle-login").style.display = "none";
            document.getElementById("toggle-register").style.display = "block";
            document.getElementById("message").textContent = '';
            document.getElementById("login-error").textContent = '';
        });

        // Registration Form Handling
        document.getElementById("register").addEventListener("submit", function(e) {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;

            document.getElementById("register-error").textContent = "";

            if (username === "" || password === "" || confirmPassword === "") {
                document.getElementById("register-error").textContent = "All fields are required!";
            } else if (password !== confirmPassword) {
                document.getElementById("register-error").textContent = "Passwords do not match!";
            } else {
                document.getElementById("message").textContent = `Registration successful! Welcome, ${username}!`;
                document.getElementById("message").className = "success";
                document.getElementById("toggle-login").style.display = "block";
                document.getElementById("toggle-register").style.display = "none";
                document.getElementById("register-form").reset();
            }
        });

        // Login Form Handling
        document.getElementById("login").addEventListener("submit", function(e) {
            e.preventDefault();

            const username = document.getElementById("login-username").value;
            const password = document.getElementById("login-password").value;

            document.getElementById("login-error").textContent = "";

            if (username === "" || password === "") {
                document.getElementById("login-error").textContent = "All fields are required!";
            } else {
                document.getElementById("user-name").textContent = username;
                document.getElementById("message").textContent = `Login successful! Welcome back, ${username}!`;
                document.getElementById("message").className = "success";

                document.getElementById("login-form").style.display = "none";
                document.getElementById("register-form").style.display = "none";
                document.getElementById("user-dashboard").style.display = "block";
            }
        });
    </script>

</body>
</html>
